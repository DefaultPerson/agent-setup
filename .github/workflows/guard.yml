name: guard

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The guard's path rules are platform-specific, so the corpus has to run on
  # every platform the hook is installed on — a crash there fails open silently.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python .claude/hooks/test_guard.py

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: diff .claude/hooks/guard.py .codex/hooks/guard.py
